name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-unsigned-ipa:
    name: Build Unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE_APP=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          echo "Using $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive unsigned Release build
        run: |
          xcodebuild -project ALIVE.xcodeproj -scheme Alive \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/ALIVE.xcarchive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            archive

      - name: Package unsigned IPA
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          IPA_NAME="ALIVE-${TAG_NAME}-unsigned.ipa"
          mkdir -p build/Payload
          cp -R build/ALIVE.xcarchive/Products/Applications/ALIVE.app build/Payload/ALIVE.app
          ditto -c -k --sequesterRsrc --keepParent build/Payload "build/${IPA_NAME}"
          shasum -a 256 "build/${IPA_NAME}" > "build/${IPA_NAME}.sha256"
          echo "IPA_PATH=build/${IPA_NAME}" >> "$GITHUB_ENV"
          echo "SHA_PATH=build/${IPA_NAME}.sha256" >> "$GITHUB_ENV"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            ${{ env.IPA_PATH }}
            ${{ env.SHA_PATH }}
